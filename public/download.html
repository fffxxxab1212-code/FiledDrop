<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Télécharger un fichier — FileDrop</title>
<meta name="description" content="Téléchargez un fichier partagé de façon temporaire via FileDrop." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/style.css" />
<link rel="icon" href="data:,">
</head>
<body>

<div class="ambient-bg"><div class="grain"></div></div>

<header class="topbar">
  <a href="/" class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 17v1a3 3 0 003 3h8a3 3 0 003-3v-1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span>
      <span class="brand-name">FileDrop</span><br/>
      <span class="brand-tag">transfert éphémère</span>
    </span>
  </a>
  <div class="topbar-note"><span class="dot"></span> Lien à usage privé</div>
</header>

<main>
  <div class="glass-panel download-card" id="download-card">
    <!-- Rempli dynamiquement par download.js : loader, contenu ou état expiré -->
    <div class="loader">
      <div class="spinner"></div>
      <p>Vérification du lien…</p>
    </div>
  </div>

  <!-- Barre de progression du téléchargement -->
  <div class="glass-panel progress-wrap" id="dl-progress-wrap">
    <div class="progress-header">
      <span id="dl-progress-label">Téléchargement en cours…</span>
      <strong id="dl-progress-percent">0%</strong>
    </div>
    <div class="progress-track"><div class="progress-fill" id="dl-progress-fill"></div></div>
  </div>
</main>

<footer>Ce lien deviendra invalide dès son expiration. Aucune donnée n'est conservée au-delà.</footer>

<div class="toast-stack" id="toast-stack"></div>

<script src="/js/toast.js"></script>
<script src="/js/helpers.js"></script>
<script src="/js/download.js"></script>
</body>
</html>
